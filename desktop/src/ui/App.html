<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CursorMouse Desktop</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="container">

    <h1>🖱️ CursorMouse</h1>

    <p class="subtitle">
      Control your computer from your phone.
    </p>

    <div class="status-card">

      <h2>Status</h2>

      <p id="status">
        🟢 Running
      </p>

    </div>

    <div class="pair-card">

      <h2>Pair Code</h2>

      <h1 id="pair-code">
        ------
      </h1>

    </div>

    <div class="device-card">

      <h2>Connected Device</h2>

      <p id="device">
        No Device Connected
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
